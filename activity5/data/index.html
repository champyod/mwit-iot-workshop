<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 3-LED Control</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="card">
    <h1>ESP32 LED Control</h1>
    <p class="sub">3 independent LEDs &middot; REST API</p>

    <div class="led-row">
      <div class="led-col">
        <div class="led-dome off blue" id="dome1"></div>
        <div class="led-base"></div>
        <div class="led-legs"><div class="led-leg"></div><div class="led-leg"></div></div>
        <div class="led-label">LED 1</div>
      </div>
      <div class="led-col">
        <div class="led-dome off green" id="dome2"></div>
        <div class="led-base"></div>
        <div class="led-legs"><div class="led-leg"></div><div class="led-leg"></div></div>
        <div class="led-label">LED 2</div>
      </div>
      <div class="led-col">
        <div class="led-dome off yellow" id="dome3"></div>
        <div class="led-base"></div>
        <div class="led-legs"><div class="led-leg"></div><div class="led-leg"></div></div>
        <div class="led-label">LED 3</div>
      </div>
    </div>

    <div class="footer">
      <span class="ft-label"><span class="dot online" id="statusDot"></span> <span id="statusText">ONLINE</span></span>
      <span class="ft-ip" id="ipDisplay"></span>
    </div>
  </div>
  <script src="/script.js"></script>
</body>
</html>
