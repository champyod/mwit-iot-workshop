[platformio]
; Single-project layout: firmware lives in src/, shared libraries in lib/.
src_dir = src
default_envs = esp32dev

[env]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = partitions_ota.csv
board_upload.flash_size = 4MB
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -Iinclude

[env:esp32dev]
upload_protocol = esptool

; OTA upload uses OTA/ota_upload.py (custom raw-TCP protocol on port 3232),
; not PlatformIO's espota client — see AGENTS.md workflow.
